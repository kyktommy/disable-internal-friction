baseURL = "/"
title = "Disable Internal Friction"
theme = "PaperMod"
paginate = 10
enableRobotsTXT = true
buildDrafts = false
buildFuture = true
buildExpired = false
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false

[minify]
  disableXML = true
  minifyOutput = true

[params]
  env = "production"
  description = "A blog about overcoming internal resistance and living with intention."
  keywords = ["mindset", "internal friction", "productivity", "self-improvement"]
  author = ""
  DateFormat = "January 2, 2006"
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowWordCount = false
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true
  comments = false
  hidemeta = false
  hideSummary = false
  showtoc = true
  tocopen = false

  [params.assets]
    disableHLJS = true

[languages]
  [languages.en]
    languageName = "English"
    weight = 1
    contentDir = "content/en"
    [languages.en.params]
      description = "A blog about overcoming internal resistance and living with intention."

  [languages.zh]
    languageName = "中文"
    title = "消除內耗"
    weight = 2
    contentDir = "content/zh"
    [languages.zh.params]
      description = "一個關於消除內耗、活得更有意圖的部落格。"

[outputs]
  home = ["HTML", "RSS", "JSON"]
